name: Desktop builds
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
      - run: uv sync --locked --python 3.13
      - run: uv run basedpyright
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - run: uv run python scripts/build.py
      - run: uv run python scripts/smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: ZhongnanGym-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.exe
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: uv run --no-project --python 3.13 python scripts/checksums.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          body_path: packaging/release-notes.md
